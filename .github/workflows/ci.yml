# Continuous Integration: runs on every push to main and on every pull request.
# A pull request can only be merged when these checks pass (see docs/BRANCH_PROTECTION.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: server (lint + tests)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017/chatapp_test
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests-1234567890
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci --if-present

  client:
    name: client (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('client/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm ci
      - name: Lint
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm run lint
      - name: Build
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm run build
