# Every pull request must say which backlog issue it closes ("Closes #12"),
# so GitHub moves the issue to Done automatically when the PR is merged.
name: Linked issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: PR references an issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Ignore the hints inside <!-- --> comments of the PR template.
            const body = (context.payload.pull_request.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const ok = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body);
            if (!ok) {
              core.setFailed('Add "Closes #<issue number>" to the pull request description.');
            } else {
              core.info('Linked issue found.');
            }
